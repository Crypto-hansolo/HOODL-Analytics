name: Refresh verified data snapshot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public Blockscout snapshot
        run: node scripts/index-snapshot.mjs
      - name: Commit snapshot when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/snapshot.json
          if git diff --cached --quiet; then
            echo 'Snapshot unchanged; no Pages deployment needed.'
          else
            git commit -m 'chore: refresh verified data snapshot'
            git push
            echo 'Snapshot committed. Triggering Pages deployment explicitly because GITHUB_TOKEN pushes do not create workflow runs.'
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
